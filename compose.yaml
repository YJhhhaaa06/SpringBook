services:
  mysql:
    image: mysql:8.4
    container_name: springbook-mysql
    restart: unless-stopped
    # 本机 3306 已被原生 mysqld 占用，宿主机改用 3307
    # 只绑回环地址，避免开发库暴露到局域网
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: springbook
      MYSQL_USER: springbook
      MYSQL_PASSWORD: springbook
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - springbook-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  springbook-mysql-data:
