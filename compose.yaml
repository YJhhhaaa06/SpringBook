services:
  mysql:
    image: mysql:8.4
    container_name: springbook-mysql
    restart: unless-stopped
    # 本机 3306 已被原生 mysqld 占用，宿主机改用 3307
    # 只绑回环地址，避免开发库暴露到局域网
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: springbook
      MYSQL_USER: springbook
      MYSQL_PASSWORD: springbook
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - springbook-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # 应用容器：只在需要「一条命令跑起来」时启用（默认不启动，宿主机开发仍用 JDK 直跑）
  #   docker compose --profile full up -d --build
  # 注意：容器内走服务名 mysql:3306，不经过宿主机的 3307 映射
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    image: springbook:local
    container_name: springbook-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: springbook
      DB_USER: springbook
      DB_PASSWORD: springbook
      # 留空时应用会 fail-fast 退出并打印原因（见 .docs/运行手册.md），
      # 这里不用 :? 是为了让「只起 MySQL」的日常命令不被强制要求该变量
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  springbook-mysql-data:
