<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="藏书阁 —— 图书借阅、预约与罚款管理的单页控制台" />
  <title>藏书阁 · 图书信息管理系统</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2335604f'/%3E%3Cpath d='M11 8h9a3 3 0 0 1 3 3v13H14a3 3 0 0 0-3 3z' fill='none' stroke='%23f6f2ea' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M11 8v16' stroke='%23f6f2ea' stroke-width='2'/%3E%3C/svg%3E" />
  <script>
    // 首屏前恢复主题，避免闪白/闪黑
    try {
      var saved = localStorage.getItem('springbook.theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
    } catch (e) { /* 隐私模式下忽略 */ }
  </script>
</head>
<body>
  <div id="root">
    <div class="boot">
      <span class="boot__mark">藏书阁</span>
      <span class="boot__hint">正在载入…</span>
    </div>
  </div>
  <div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-host"></div>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">本控制台需要启用 JavaScript。</p>
  </noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
